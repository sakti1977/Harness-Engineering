name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/harness_check.py --adapter copilot
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest examples.booking.test_booking -v
      - run: python -m examples.booking.demo
      - run: python scripts/export_handbook.py --check
      - run: python scripts/check_docs.py
